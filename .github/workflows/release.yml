name: 'Release Automation'

on:
  push:
    tags:
      - 'v*' # Only trigger compilation when pushing tags starting with v, e.g., v0.1.0

jobs:
  release:
    permissions:
      contents: write # Allows creating releases and uploading assets
    strategy:
      fail-fast: false
      matrix:
        # Run compilation on macOS, Ubuntu, and Windows respectively
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install # We have already switched to npm

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # Use the current tag name
          releaseName: 'Useless Subtitle ${{ github.ref_name }}'
          releaseBody: '欢迎下载 Useless Subtitle。请根据您的操作系统选择对应的安装包下载（Windows 请下载 .msi 或 .exe，macOS 请下载 .dmg，Linux 下载 .AppImage 或 .deb）。'
          releaseDraft: false
          prerelease: false
