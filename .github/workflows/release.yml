name: 'Release Automation'

on:
  push:
    tags:
      - 'v*' # 只有推送 v 开头的 tag 时才触发编译，比如 v0.1.0

jobs:
  release:
    permissions:
      contents: write # 允许创建 Release 并上传文件
    strategy:
      fail-fast: false
      matrix:
        # 分别在 Mac, Ubuntu 和 Windows 上运行编译
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install # 我们前面已经切换为了 npm

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # 使用当前的 Tag 名字
          releaseName: 'Useless Subtitle ${{ github.ref_name }}'
          releaseBody: '欢迎下载 Useless Subtitle。请根据您的操作系统选择对应的安装包下载（Windows 请下载 .msi 或 .exe，macOS 请下载 .dmg，Linux 下载 .AppImage 或 .deb）。'
          releaseDraft: false
          prerelease: false
