name: Release Automation

on:
  push:
    branches:
      - main
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            artifact: macos-aarch64
            rust_targets: aarch64-apple-darwin
            tauri_args: --verbose --target aarch64-apple-darwin --bundles app,dmg
            target_dir: src-tauri/target/aarch64-apple-darwin/release
          - platform: macos-15-intel
            artifact: macos-x64
            rust_targets: x86_64-apple-darwin
            tauri_args: --verbose --target x86_64-apple-darwin --bundles app,dmg
            target_dir: src-tauri/target/x86_64-apple-darwin/release
          - platform: ubuntu-22.04
            artifact: linux-x64
            rust_targets: ''
            tauri_args: --verbose --bundles deb,appimage,rpm
            target_dir: src-tauri/target/release
          - platform: windows-latest
            artifact: windows-x64
            rust_targets: ''
            tauri_args: --verbose --bundles nsis,msi
            target_dir: src-tauri/target/release

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Show macOS build environment
        if: startsWith(matrix.platform, 'macos-')
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          rustc --version --verbose
          node --version
          npm --version

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Check macOS Rust target
        if: startsWith(matrix.platform, 'macos-')
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust_targets }}

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.tauri_args }}

      - name: Package macOS portable application
        if: startsWith(matrix.platform, 'macos-')
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "${{ matrix.target_dir }}/bundle/macos/Useless Subtitle.app"
          "Useless-Subtitle_${{ matrix.artifact }}_Portable.zip"

      - name: Package Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p portable
          cp "${{ matrix.target_dir }}/useless-subtitle.exe" portable/
          7z a Useless-Subtitle_Windows_x64_Portable.zip ./portable/useless-subtitle.exe

      - name: Upload macOS build artifacts
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.target_dir }}/bundle/dmg/*.dmg
            Useless-Subtitle_${{ matrix.artifact }}_Portable.zip
          if-no-files-found: error

      - name: Upload Linux build artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.target_dir }}/bundle/deb/*.deb
            ${{ matrix.target_dir }}/bundle/appimage/*.AppImage
            ${{ matrix.target_dir }}/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload Windows build artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.target_dir }}/bundle/msi/*.msi
            ${{ matrix.target_dir }}/bundle/nsis/*-setup.exe
            Useless-Subtitle_Windows_x64_Portable.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts

      - name: List release assets
        run: find release-artifacts -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Useless Subtitle ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
          body: |
            ## Useless Subtitle ${{ github.ref_name }}

            A minimalist desktop mask overlay tool for hiding unwanted subtitles.

            ### Portable packages
            - **Windows x64**: Download `Useless-Subtitle_Windows_x64_Portable.zip`.
            - **macOS Apple Silicon**: Download the `macos-aarch64` DMG or portable ZIP.
            - **macOS Intel**: Download the `macos-x64` DMG or portable ZIP.
            - **Linux x64**: Download the AppImage package.

            ### Installers
            - **Windows x64**: MSI or setup executable.
            - **macOS**: DMG for Apple Silicon or Intel.
            - **Linux x64**: DEB or RPM.
